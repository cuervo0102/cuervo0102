name: metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # regenerates once a day

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cuervo0102
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: columns
          config_columns: 2

          # Language breakdown bars
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_details: bytes-size, percentage

          # Isometric commit calendar cube
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most used topics/technologies
          plugin_topics: yes
          plugin_topics_mode: icons

          # Contribution calendar + streaks
          plugin_calendar: yes

          # 🎀 Girly pink theme
          extras_css: |
            :root {
              --color-canvas-default: #fff0f5 !important;
              --color-canvas-subtle: #ffe4ec !important;
              --color-border-default: #ffb6c1 !important;
              --color-border-muted: #ffd1dc !important;
              --color-fg-default: #7a2e4d !important;
              --color-fg-muted: #b6597a !important;
              --color-accent-fg: #ff69b4 !important;
              --color-accent-emphasis: #ff1493 !important;
              --color-success-fg: #ff85a2 !important;
              --color-attention-fg: #ffb3c6 !important;
              --color-danger-fg: #ff4d94 !important;
            }
            body, text, tspan { font-family: "Comic Sans MS", "Segoe UI", sans-serif !important; }
            h2 { color: #ff1493 !important; }