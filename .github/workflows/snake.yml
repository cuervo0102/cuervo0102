name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: cuervo0102
          outputs: |
            dist/pink-snake.svg?palette=github-dark&color_snake=#ff1493&color_dots=#ffe4ec,#ffb6c1,#ff8fab,#ff5c96,#ff1493
            dist/pink-snake.gif?palette=github-dark&color_snake=#ff1493&color_dots=#ffe4ec,#ffb6c1,#ff8fab,#ff5c96,#ff1493

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
